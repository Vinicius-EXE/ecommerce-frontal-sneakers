spring.application.name=frontal-sneakers-backend

# Configuração do H2 Database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuração do DataSource (Conexão com o Banco)
# "frontalsneakersdb" é o nome do nosso banco de dados em memória
spring.datasource.url=jdbc:h2:mem:frontalsneakersdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA (Hibernate)
# "create-drop" apaga e recria o banco a cada reinicialização (bom para dev)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Mostra os comandos SQL no console (ótimo para debug)