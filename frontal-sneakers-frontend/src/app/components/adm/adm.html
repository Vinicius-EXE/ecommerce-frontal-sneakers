<div class="adm">

  <!-- TOPO -->
  <header class="topbar">
    <h1>Produtos</h1>
  </header>

  <!-- LAYOUT PRINCIPAL -->
  <div class="layout">

    <!-- MENU LATERAL -->
    <aside class="sidebar">
      <h2 class="menu-title">Admin</h2>
    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

      <!-- FORMULARIO -->
      <section class="form-container">

        <!-- NOME DO PRODUTO -->
        <div class="form-group">
          <label>Nome do produto</label>
          <input type="text" placeholder="Tênis Adidas XYZ">
        </div>

        <!-- DETALHE -->
        <div class="form-group">
          <label>Detalhe</label>
          <textarea placeholder="Descrição do seu produto"></textarea>
        </div>

        <!-- CATEGORIA -->
        <div class="form-group">
          <label>Categoria</label>
          <input type="text" placeholder="Sneaker">
        </div>

        <!-- MARCA -->
        <div class="form-group">
          <label>Marca</label>
          <input type="text" placeholder="Adidas">
        </div>

        <!-- GRID DE 2 CAMPOS -->
        <div class="form-grid-2">
          <div class="form-group">
            <label>COD</label>
            <input type="text" placeholder="#32A53">
          </div>

          <div class="form-group">
            <label>Quantidade no estoque</label>
            <input type="number" placeholder="211">
          </div>
        </div>

        <!-- PREÇO -->
        <div class="form-group">
          <label>Preço</label>
          <input type="text" placeholder="R$110,40">
        </div>

        <!-- TAGS -->
        <div class="form-group">
          <label>Tags</label>
          <div class="tags">
            <span class="badge">Casual</span>
            <span class="badge">Corrida</span>
            <span class="badge">Infantil</span>
            <span class="badge">Feminino</span>
            <span class="badge">Masculino</span>
            <span class="badge">Adidas</span>
            <span class="badge">Nike</span>
            <span class="badge">Puma</span>
            <span class="badge">Vans</span>
          </div>
        </div>

        <!-- IMAGEM DO PRODUTO -->
        <div class="upload-box">
          <p class="upload-title">Product Gallery</p>
          <div class="upload-area">
            <img src="" alt="">
            <p>Arraste a imagem ou clique para selecionar</p>
            <span>Formatos aceitos: JPG ou PNG</span>
          </div>
        </div>

        <!-- BOTOES -->
        <div class="btn-row">
          <button class="btn update">Update</button>
          <button class="btn delete">Delete</button>
          <button class="btn cancel">Cancel</button>
        </div>

      </section>
    </main>
  </div>
</div>
