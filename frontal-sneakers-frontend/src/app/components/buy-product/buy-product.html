<div class="buy-product-card" *ngIf="product">
    <div class="text-content">
        <h1 class="product-title">Tênis {{ product.brand }} {{ product.name }}</h1>

        <div class="price-container">
            <span class="current-price">{{ product.price | currency:'BRL' }}</span>
            <p class="installments">ou ate 10x de <strong>{{ (product.price / 10) | currency:'BRL' }}</strong></p>
        </div>
    </div>

    <div class="section size-section">
        <p class="section-label">Tamanho:</p>
        <div class="size-grid">
            <button *ngFor="let size of sizes" class="size-btn" [class.selected]="selectedSize === size"
                (click)="selectSize(size)">
                {{ size }}
            </button>
        </div>
    </div>

    <div class="section quantity-section">
        <p class="section-label">Quantidade:</p>
        <div class="actions-row">
            <div class="quantity-control">
                <button (click)="decrementQuantity()">−</button>
                <span>{{ quantity }}</span>
                <button (click)="incrementQuantity()">+</button>
            </div>
            <button class="buy-btn">Compre aqui</button>
        </div>
    </div>
</div>
