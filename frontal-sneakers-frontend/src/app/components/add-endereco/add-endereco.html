<div class="endereco-card">

  <!-- Título principal -->
  <h2 class="card-title">Adicionar endereço</h2>

  <!-- FORMULÁRIO ENDEREÇO -->
  <div class="form-section">
    <div class="form-grid">

      <div class="form-group">
        <label>CEP</label>
        <input type="text" placeholder="00000-000">
      </div>

      <div class="form-group">
        <label>Rua / Avenida</label>
        <input type="text" placeholder="Ex: Rua Alberto Santos">
      </div>

      <div class="form-group">
        <label>Número</label>
        <input type="text" placeholder="123">
      </div>

      <div class="form-group">
        <label>Complemento (opcional)</label>
        <input type="text" placeholder="Apartamento, bloco...">
      </div>

    </div>
  </div>

  <!-- DIVISOR -->
  <hr class="divider">

  <!-- TIPO DE LOCAL -->
  <div class="form-section">

    <p class="section-title">Este lugar de destino é?</p>

    <div class="type-select">
      <button class="type-btn">
        <span class="icon"></span>
        Casa
      </button>

      <button class="type-btn">
        <span class="icon"></span>
        Trabalho
      </button>
    </div>
  </div>

  <!-- CONTATO -->
  <div class="form-section">

    <p class="section-title">Dados de contato</p>

    <div class="form-grid">

      <div class="form-group">
        <label>Nome e sobrenome</label>
        <input type="text" placeholder="João Silva">
      </div>

      <div class="form-group">
        <label>Telefone de contato</label>
        <input type="text" placeholder="(11) 99999-9999">
      </div>

    </div>
  </div>
</div>
