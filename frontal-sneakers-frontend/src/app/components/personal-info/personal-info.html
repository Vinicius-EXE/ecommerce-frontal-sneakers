<main class="main-container">
    <h2>Informações Pessoais</h2>
    <form [formGroup]="personalInfoForm" (ngSubmit)="onSubmit()" class="personal-info-form">
        <div class="form-group">
            <label for="name">Nome do Usuário</label>
            <input type="text" id="name" formControlName="name" placeholder="Digite seu nome">
        </div>

        <div class="form-group">
            <label for="nickname">Nickname do Usuário</label>
            <input type="text" id="nickname" formControlName="nickname" placeholder="Digite seu nickname (@...)">
        </div>

        <div class="form-group">
            <label for="cpf">CPF do Usuário</label>
            <input type="text" id="cpf" formControlName="cpf" (input)="onCpfInput($event)" placeholder="000.000.000-00">
        </div>

        <div class="form-group">
            <label for="phone">Telefone do Usuário</label>
            <input type="text" id="phone" formControlName="phone" (input)="onPhoneInput($event)"
                placeholder="(00) 00000-0000">
        </div>

        <button type="submit" class="save-btn" [disabled]="!personalInfoForm.valid">Salvar</button>
    </form>
</main>
