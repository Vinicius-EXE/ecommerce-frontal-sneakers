<div class="singin-container">
    <span class="text-container">
        <h1>Entrar</h1>
        <p>Bem-vindo de volta!</p>
        <p>Bora garantir aquele Dorp antes<br>que acabe?</p>
    </span>

    <form (ngSubmit)="login()">
        <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required>
        <div class="password-container">
            <input [type]="showPassword ? 'text' : 'password'" placeholder="Senha" [(ngModel)]="password"
                name="password" required>
            <button type="button" class="hidden-password" (click)="togglePasswordVisibility()">
                <i class="fa-solid" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
            </button>
        </div>

        <a href="#" class="forgot-password">Esqueceu a senha?</a>

        <button type="submit" class="singin-action-btn">Entrar</button>
        <a href="/auth/singup" class="go-to-singup-btn">Não tem conta? Clique aqui!</a>
    </form>
</div>
