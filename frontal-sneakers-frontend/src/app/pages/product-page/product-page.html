<div *ngIf="isLoading" class="loading-container">
    <p>Carregando produto...</p>
</div>

<div *ngIf="errorMessage" class="error-container">
    <p>{{ errorMessage }}</p>
</div>

<main class="page-content" *ngIf="!isLoading && !errorMessage && product">
    <app-header></app-header>
    <section class="header-content">
        <app-product-image-carousel [images]="product.images"></app-product-image-carousel>
        <div class="right-content">
            <app-buy-product [product]="product"></app-buy-product>
            <app-product-description [description]="product.description"></app-product-description>
        </div>
    </section>
    <app-products-slider title="Produtos Relacionados" [brand]="product.brand"></app-products-slider>
    <app-rodape></app-rodape>
</main>
